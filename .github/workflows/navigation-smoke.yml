name: Projects navigation smoke test
on:
  push:
    branches:
      - main
      - feat/reversible-project-navigation
      - feat/single-camera-project-portal
      - feat/responsive-all-devices
  pull_request:
  workflow_dispatch:
jobs:
  twenty-round-trips:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.56.1
      - name: Serve static Projects site
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/projects-http.log 2>&1 &
          sleep 2
          curl -fsSI http://127.0.0.1:8123/index.html
      - name: Verify source, links, CSS and metadata
        run: node tests/static-audit.cjs
      - name: Verify page lifecycle, keyboard interaction and responsive
        run: PROJECTS_TEST_CHROME=1 node tests/quality-regression.cjs
      - name: Verify reverse scroll after returning from RackFlow
        run: PROJECTS_TEST_CHROME=1 node tests/scroll-return-regression.cjs
      - name: Verify 20 navigation cycles and accessibility fallback
        run: PROJECTS_TEST_CHROME=1 node tests/navigation-smoke.cjs

  mobile-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Safari WebKit simulation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Serve Projects locally
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/projects-http.log 2>&1 &
          sleep 2
          curl -fsSI http://127.0.0.1:8123/index.html
      - name: Verify Android touchscreen and iPhone iPad WebKit
        run: PROJECTS_TEST_CHROME=1 node tests/mobile-responsive.cjs
